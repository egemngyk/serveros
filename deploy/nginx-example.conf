# Example reverse proxy for ServerOS. Copy it manually — ServerOS never edits your Nginx configuration on install.
# Replace dashboard.example.com and the certificate paths. Issue the certificate first (Settings → Nginx → SSL).

server {
    listen 80;
    server_name dashboard.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dashboard.example.com;

    ssl_certificate     /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15552000" always;

    # uploads / backups can be large; stream them instead of buffering
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets (terminals, live logs, monitoring)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # live log / progress streaming
        proxy_buffering off;
    }
}

# in the http {} block (usually /etc/nginx/nginx.conf):
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
